name: Release

on:
  push:
    tags:
      - 'v*' # Trigger on version tags, e.g., v1.0.0
  workflow_dispatch: # Allow manual trigger from the UI

permissions:
  contents: write # Needed for creating a release

jobs:
  build-linux:
    name: Build Linux (${{ matrix.arch }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - arch: amd64
            docker_platform: linux/amd64
          - arch: arm64
            docker_platform: linux/arm64
          - arch: arm
            docker_platform: linux/arm/v7
          - arch: 386
            docker_platform: linux/386

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Build static binary
        run: |
          # Use QEMU and Alpine Linux to cross-compile fully static portable binaries for each architecture
          docker run --rm --platform ${{ matrix.docker_platform }} -v ${{ github.workspace }}:/workspace -w /workspace alpine:latest sh -c "\
            apk add --no-cache build-base && \
            make clean && \
            make CXXFLAGS='-O2 -std=c++17 -static' LDFLAGS='-static' \
          "

      - name: Rename binary for release
        run: mv gettype gettype-linux-${{ matrix.arch }}

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: binaries-linux-${{ matrix.arch }}
          path: gettype-linux-${{ matrix.arch }}

  build-windows:
    name: Build Windows
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install MinGW cross-compiler
        run: sudo apt-get update && sudo apt-get install -y mingw-w64

      - name: Build Windows binary
        run: |
          make clean
          make CXX=x86_64-w64-mingw32-g++ CXXFLAGS='-O2 -std=c++17 -static' LDFLAGS='-static'
          # Cross-compiling on Linux sometimes leaves the file without .exe extension or with it depending on Make behavior
          [ -f gettype.exe ] && mv gettype.exe gettype-windows-amd64.exe || mv gettype gettype-windows-amd64.exe

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: binaries-windows
          path: gettype-windows-amd64.exe

  release:
    name: Release
    needs: [build-linux, build-windows]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download all binaries
        uses: actions/download-artifact@v4
        with:
          pattern: binaries-*
          merge-multiple: true
          path: binaries

      - name: Move latest tag
        if: github.ref_type != 'tag'
        run: |
          git config --global user.name "GitHub Actions"
          git config --global user.email "actions@github.com"
          git tag -f latest
          git push origin -f latest

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_type == 'tag' && github.ref_name || 'latest' }}
          files: binaries/gettype-*
          generate_release_notes: true
          make_latest: true
